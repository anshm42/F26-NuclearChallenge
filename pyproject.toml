[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nppad-leak-detection"
version = "0.1.0"
description = "Calibrated gradient-boosting leak detection for NPPAD simulations"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.2,<2",
]

[project.scripts]
leak-model = "leak_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
